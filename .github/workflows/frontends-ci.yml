name: frontends-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  merchant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vite build
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vite build
  courier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/courier-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vite build

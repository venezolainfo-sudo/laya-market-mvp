name: backend-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laya_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laya_market"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/laya_market
      JWT_SECRET: ci-secret-only
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m alembic upgrade head
      - run: python -m app.seed
      - run: python -m pytest -q
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl --fail http://127.0.0.1:8000/health

services:
  db:
    image: postgres:16
    container_name: laya_market_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laya_market
      POSTGRES_USER: laya
      POSTGRES_PASSWORD: laya_dev_password
    ports:
      - "5433:5432"
    volumes:
      - laya_market_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laya -d laya_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  laya_market_postgres_data:
